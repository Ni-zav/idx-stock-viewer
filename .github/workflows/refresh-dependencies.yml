name: Refresh dependency lockfile
on:
  push:
    branches: [chore/npm-security-modernization]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile and compatible security fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --json > npm-audit-result.json || true
          node -e "const a=require('./npm-audit-result.json'); console.log('Remaining vulnerabilities:', JSON.stringify(a.metadata?.vulnerabilities||{})); for(const [k,v] of Object.entries(a.vulnerabilities||{})) console.log(k, v.severity, v.fixAvailable);"
      - name: Commit resolved lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency lockfile already current'
          else
            git commit -m "chore: resolve audited dependency lockfile"
            git push origin HEAD:chore/npm-security-modernization
          fi
